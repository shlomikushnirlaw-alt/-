<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI-ERP — Automation, AI Agents and RAG with n8n">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171C"/>
      <stop offset="100%" stop-color="#1B1F26"/>
    </linearGradient>
    <linearGradient id="drop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9C7B8"/>
      <stop offset="100%" stop-color="#C98B6B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C98B6B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C98B6B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#2A303A" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.35"/>
  <circle cx="1010" cy="130" r="170" fill="url(#glow)"/>

  <!-- signature mark: a dropper bottle formed from thin circuit-like lines, right side -->
  <g transform="translate(930,60)" stroke="#8B93A0" stroke-width="1.4" fill="none" opacity="0.9">
    <path d="M40 0 L40 34" />
    <rect x="24" y="34" width="32" height="18" rx="3" stroke="#C98B6B"/>
    <path d="M28 52 L20 78 Q18 150 40 168 Q62 150 60 78 L52 52" stroke="#C98B6B" stroke-width="1.6"/>
    <circle cx="40" cy="120" r="5" fill="#E9C7B8" stroke="none"/>
    <path d="M40 168 L40 205" stroke="#3A414D"/>
    <circle cx="40" cy="205" r="3.5" fill="#7FA98A" stroke="none"/>
    <path d="M40 205 L96 205" stroke="#3A414D"/>
    <circle cx="96" cy="205" r="3.5" fill="#7FA98A" stroke="none"/>
    <path d="M96 205 L96 240" stroke="#3A414D"/>
    <path d="M40 205 L-24 205" stroke="#3A414D"/>
    <circle cx="-24" cy="205" r="3.5" fill="#7FA98A" stroke="none"/>
    <path d="M-24 205 L-24 240" stroke="#3A414D"/>
  </g>

  <!-- eyebrow -->
  <text x="80" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="4" fill="#7FA98A">n8n CLOUD · AI AGENTS · RAG</text>

  <!-- title -->
  <text x="78" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="600" fill="#EDEAE4">AI-<tspan fill="url(#drop)">ERP</tspan></text>

  <!-- subtitle EN -->
  <text x="80" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#C7CCD4">A working mini-ERP for an Israeli cosmetics &amp; skincare business</text>

  <!-- subtitle HE -->
  <text x="1120" y="248" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#9AA1AC" direction="rtl">מערכת ERP קטנה ועובדת לעסק קוסמטיקה וטיפוח ישראלי</text>

  <!-- baseline rule -->
  <line x1="80" y1="252" x2="1120" y2="252" stroke="#2A303A" stroke-width="1"/>

  <!-- footer chips -->
  <text x="80" y="284" font-family="'Courier New', monospace" font-size="14" fill="#8B93A0">Telegram</text>
  <text x="190" y="284" font-family="'Courier New', monospace" font-size="14" fill="#8B93A0">Airtable</text>
  <text x="300" y="284" font-family="'Courier New', monospace" font-size="14" fill="#8B93A0">Gmail</text>
  <text x="390" y="284" font-family="'Courier New', monospace" font-size="14" fill="#8B93A0">Google Drive</text>
  <text x="520" y="284" font-family="'Courier New', monospace" font-size="14" fill="#8B93A0">RAG / Vector Store</text>
  <circle cx="72" cy="280" r="3" fill="#C98B6B"/>
  <circle cx="182" cy="280" r="3" fill="#C98B6B"/>
  <circle cx="292" cy="280" r="3" fill="#C98B6B"/>
  <circle cx="382" cy="280" r="3" fill="#C98B6B"/>
  <circle cx="512" cy="280" r="3" fill="#C98B6B"/>
</svg>
